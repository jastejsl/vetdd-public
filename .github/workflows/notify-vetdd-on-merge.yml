name: Notify VetDD on Feedback Merge

on:
  push:
    branches:
      - main
    paths:
      - 'diseases/disease-files/**'
      - 'syndromes/syndrome-files/**'
      - 'pathology/organ-path/**'
      - 'pathology/gen-path/**'

jobs:
  dispatch-reverse-sync:
    name: Trigger Reverse-Sync in VetDD
    runs-on: ubuntu-latest

    steps:
      - name: Send repository_dispatch event to VetDD
        env:
          VETDD_SYNC_PAT: ${{ secrets.VETDD_SYNC_PAT }}
        run: |
          if [ -z "${VETDD_SYNC_PAT}" ]; then
            echo "::error::VETDD_SYNC_PAT secret is missing in this repository! Go to Settings -> Secrets and variables -> Actions to add it."
            exit 1
          fi
          echo "Sending repository_dispatch to jastejsl/vetdd..."
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${VETDD_SYNC_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jastejsl/vetdd/dispatches \
            -d "{\"event_type\":\"feedback-merged\",\"client_payload\":{\"ref\":\"${{ github.ref }}\",\"sha\":\"${{ github.sha }}\"}}"
          echo "Successfully dispatched event to VetDD."
